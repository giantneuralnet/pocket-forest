<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="theme-color" content="#a8d6ed" />
    <title>Pocket Forest — Tokushima</title>
    <link rel="stylesheet" href="style.css?v=24" />
  </head>
  <body>
    <main id="world" aria-label="Interactive woodland and planting bed">
      <div id="scene"></div>
      <h1 id="phaseTitle" class="farmer-bubble"></h1>
      <div id="weedAlerts"></div>
      <div id="tooltip" role="status"></div>
      <div id="selection"></div>
      <button id="seedLeft" class="seed-arrow" aria-label="Move seedling left" hidden>←</button>
      <button id="seedRight" class="seed-arrow" aria-label="Move seedling right" hidden>→</button>
      <div id="toast" role="status" aria-live="polite"></div>
      <div id="fatal" hidden></div>
    </main>
    <div id="topHUD">
      <strong id="money" aria-label="Budget"></strong>
      <div class="phase">
        <div id="timeline" hidden>
          <div><span id="date"></span><span id="remaining"></span></div>
          <progress id="progress" max="1095" aria-label="Tending progress"></progress>
          <div id="speeds" role="group" aria-label="Simulation speed"></div>
        </div>
      </div>
    </div>
    <div id="bottomHUD">
      <div id="stageBin" aria-label="Stage actions">
        <div id="actions"></div>
      </div>
      <div id="toolBin" aria-label="Forest tools and controls">
        <button id="back" aria-label="Previous stage" title="Previous stage">←</button>
        <div id="utilityBin">
          <button id="home" aria-label="Plot" title="Plot"><svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-7 9 7M5.5 10v10h13V10M10 20v-6h4v6"/></svg></button>
          <button id="notebook" aria-label="Notebook" title="Notebook"><svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3.5" width="14" height="17" rx="2"/><path d="M9 3.5v17M12 9h4m-4 4h4"/></svg></button>
          <button id="sound" aria-pressed="false" aria-label="Forest sound" title="Turn sound on"><svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="sound-muted" d="m16.5 10 4 4m0-4-4 4"/><path class="sound-waves" d="M16 9a4 4 0 0 1 0 6m2.5-8a7 7 0 0 1 0 10"/></svg></button>
          <button id="restart" aria-label="Start again"><svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5m4.7-1a7.5 7.5 0 1 0-1.5 6.3"/></svg></button>
        </div>
        <button id="next" class="primary" aria-label="Next stage">→</button>
      </div>
    </div>
    <dialog id="panel">
      <button id="closePanel" class="close" aria-label="Close panel">×</button>
      <div id="panelContent"></div>
    </dialog>
    <script type="module" src="game.js?v=27"></script>
  </body>
</html>
