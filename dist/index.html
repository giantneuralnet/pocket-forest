<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="theme-color" content="#a8d6ed" />
    <title>Pocket Forest — Tokushima</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="world" aria-label="Interactive woodland and planting bed">
      <div id="scene"></div>
      <h1 id="phaseTitle" class="farmer-bubble"></h1>
      <div id="weedAlerts"></div>
      <div id="tooltip" role="status"></div>
      <div id="selection"></div>
      <button id="seedLeft" class="seed-arrow" aria-label="Move seedling left" hidden>←</button>
      <button id="seedRight" class="seed-arrow" aria-label="Move seedling right" hidden>→</button>
      <div id="toast" role="status" aria-live="polite"></div>
      <div id="fatal" hidden></div>
    </main>
    <div id="topHUD">
      <strong id="money" aria-label="Budget"></strong>
      <div class="phase">
        <div id="steps"></div>
        <div id="timeline" hidden>
          <div><span id="date"></span><span id="remaining"></span></div>
          <progress id="progress" max="1095" aria-label="Tending progress"></progress>
        </div>
      </div>
    </div>
    <div id="bottomHUD">
      <div id="stageBin" aria-label="Stage actions">
        <div id="actions"></div>
        <label id="speeds" hidden
          ><select id="timeScale" aria-label="Simulation speed"></select></label>
        <button id="next" class="primary"></button>
      </div>
      <div id="toolBin" aria-label="Forest tools and controls">
        <button id="home">Go to Plot</button>
        <button id="notebook">Notebook <span id="count">0</span></button>
        <div class="soil-stats">
          <span
            >Moisture <b id="moisture"></b
            ><meter id="moistureMeter" min="0" max="100"></meter></span
          ><span
            >Nutrients <b id="nutrients"></b
            ><meter id="nutrientMeter" min="0" max="100"></meter></span
          ><span id="weather"></span>
        </div>
        <button id="about" aria-label="About the forest">?</button>
        <button id="restart" aria-label="Start again">↻</button>
      </div>
    </div>
    <dialog id="panel">
      <button id="closePanel" class="close" aria-label="Close panel">×</button>
      <div id="panelContent"></div>
    </dialog>
    <script type="module" src="game.js"></script>
  </body>
</html>
